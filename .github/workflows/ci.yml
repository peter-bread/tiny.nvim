---
name: CI

on:
  push:
  pull_request:

  workflow_dispatch:

jobs:
  type-check:
    runs-on: ubuntu-latest
    env:
      NVIM_APPNAME: "tiny.nvim"
      TINY_NVIM_CI: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Set XDG_CONFIG_HOME
        run: echo "XDG_CONFIG_HOME=$(dirname "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"

      - name: Install emmylua_check
        run: |
          x=$HOME/.local/bin
          echo "$x"
          echo "$PATH" | tr ':' '\n'
          wget https://github.com/EmmyLuaLs/emmylua-analyzer-rust/releases/download/0.25.1/emmylua_check-linux-x64-glibc.2.17.tar.gz
          tar -xvf emmylua_check-linux-x64-glibc.2.17.tar.gz
          ./emmylua_check -h
          mv ./emmylua_check "$x"
          ls -la "$x"

      - run: |
          # nvim --headless +qa
          ./scripts/type-check.sh
